
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students | Shivam Tutorials</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<header class="main-header">
  <div class="brand">
    <div class="brand-logo">ST</div>
    <div><h1>SHIVAM TUTORIALS</h1><p>STUDENT MANAGEMENT SYSTEM</p></div>
  </div>
</header>

<nav class="main-nav">
  <a href="../index.html">Dashboard</a>
  <a href="add-student.html">Add Student</a>
  <a class="active" href="view-students.html">Students</a>
  <a href="attendance.html">Attendance</a>
  <a href="attendance-report.html">Attendance Report</a>
  <a href="fees.html">Fees</a>
  <a href="reports.html">Excel & Reports</a>
</nav>

<main class="container">
  <section class="section-card">
    <h2>Student Records</h2>
    <p class="muted">Select a student to view their profile.</p>

    <div class="form-group" style="margin-top:15px">
      <label>Search Student</label>
      <input id="search" placeholder="Search by name or student ID">
    </div>

    <div class="form-group">
      <label>Filter Status</label>
      <select id="statusFilter">
        <option value="All">All Students</option>
        <option value="Active">Active</option>
        <option value="Deactive">Deactive</option>
      </select>
    </div>

    <div style="overflow-x:auto">
      <table class="data-table">
        <thead>
          <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Class</th>
            <th>Status</th>
            <th>Profile</th>
          </tr>
        </thead>
        <tbody id="studentRows"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="main-footer">
  <strong>SHIVAM TUTORIALS</strong>
  <p>Education with Excellence • Since 2019</p>
</footer>

<script src="../js/database.js"></script>
<script>
  let allStudents = [];

  async function loadStudents() {
    await DB.init();
    allStudents = await DB.getAll("students");
    renderStudents();
  }

  function renderStudents() {
    const search = document.getElementById("search").value.toLowerCase();
    const filter = document.getElementById("statusFilter").value;

    const filtered = allStudents.filter(s => {
      const matchesSearch =
        (s.name || "").toLowerCase().includes(search) ||
        (s.studentCode || "").toLowerCase().includes(search);

      const matchesStatus = filter === "All" || s.status === filter;
      return matchesSearch && matchesStatus;
    });

    const tbody = document.getElementById("studentRows");
    tbody.innerHTML = "";

    filtered.forEach(student => {
      const tr = document.createElement("tr");

      const idCell = document.createElement("td");
      idCell.textContent = student.studentCode || student.id;

      const nameCell = document.createElement("td");
      nameCell.textContent = student.name;

      const classCell = document.createElement("td");
      classCell.textContent = student.className;

      const statusCell = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = student.status === "Active"
        ? "badge badge-active"
        : "badge badge-inactive";
      badge.textContent = student.status;
      statusCell.appendChild(badge);

      const actionCell = document.createElement("td");
      const profileLink = document.createElement("a");
      profileLink.href = "student-profile.html?id=" + encodeURIComponent(student.id);
      profileLink.className = "btn";
      profileLink.textContent = "Open";
      actionCell.appendChild(profileLink);

      tr.append(idCell, nameCell, classCell, statusCell, actionCell);
      tbody.appendChild(tr);
    });

    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="5">No students found.</td></tr>';
    }
  }

  document.getElementById("search").addEventListener("input", renderStudents);
  document.getElementById("statusFilter").addEventListener("change", renderStudents);

  loadStudents().catch(console.error);
</script>
</body>
</html>
